name: Develop API checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  api:
    name: API unit and database integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopnest
          POSTGRES_PASSWORD: shopnest
          POSTGRES_DB: shopnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shopnest:shopnest@localhost:5432/shopnest_test
      JWT_ACCESS_SECRET: integration-test-access-secret-1234567890
      JWT_REFRESH_SECRET: integration-test-refresh-secret-12345678
      WEB_URL: http://localhost:3000
      NODE_ENV: test
      SHOPNEST_DISPOSABLE_DB: 'true'
      CATALOG_WORKER_ENABLED: 'false'
      CATALOG_SCHEDULE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shopnest/media-origins build
      - run: pnpm --filter @shopnest/api exec prisma generate --schema prisma/schema.prisma
      - run: pnpm --filter @shopnest/api type-check
      - run: pnpm --filter @shopnest/api exec jest --runInBand
      - name: Apply migrations
        run: pnpm --filter @shopnest/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Check shadow database replay
        run: |
          createdb -h localhost -U shopnest shopnest_shadow
          pnpm --filter @shopnest/api exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://shopnest:shopnest@localhost:5432/shopnest_shadow
        env:
          PGPASSWORD: shopnest
      - name: Run catalog and checkout integration tests
        run: pnpm --filter @shopnest/api exec jest --config ./test/jest-e2e.json --runInBand catalog-import.integration.spec.ts concurrency.integration.spec.ts media-upload.integration.spec.ts

      # These tests share a dedicated CI database and deliberately run in order.
      - name: Test demo catalog behavior
        run: pnpm --filter @shopnest/api exec jest --config ./test/jest-e2e.json --runInBand demo-catalog.integration.spec.ts
      - name: Test demo catalog access
        run: pnpm --filter @shopnest/api exec jest --config ./test/jest-e2e.json --runInBand demo-catalog-access.integration.spec.ts

  web:
    name: Web type check, lint, tests, and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shopnest/media-origins build
      - run: pnpm --filter @shopnest/web type-check
      - run: pnpm --filter @shopnest/web lint
      - run: pnpm --filter @shopnest/web exec jest --runInBand
      - run: pnpm --filter @shopnest/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
